name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml $SRC"
            exit 1
          fi
          echo "VERSION=$SRC" >> "$GITHUB_ENV"

      - name: Extract CHANGELOG section
        run: |
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              line = $0
              sub(/^## \[?/, "", line)
              split(line, parts, /[] ]/)
              if (parts[1] == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section for $VERSION"
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
