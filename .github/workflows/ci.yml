name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Typography guard (no em dash, en dash or middle dot)
        run: |
          if grep -RPl "[\x{2014}\x{2013}\x{00B7}]" --include="*.md" .; then
            echo "Forbidden typographic character found in a Markdown file (see above)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Run pipeline on real data sample
        run: python -m health_pipeline.pipeline --input data/sample/finess_sample.csv --output reports/

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
