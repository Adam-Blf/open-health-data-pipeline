[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-pipeline"
version = "0.1.0"
description = "Open health data pipeline: ingestion, quality checks, k-anonymity risk report and hospital activity indicators on French open data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adam Beloucif" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_pipeline"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
